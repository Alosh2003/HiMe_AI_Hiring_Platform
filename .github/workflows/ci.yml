name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json has no `packageManager` field, so the version is pinned here.
      # pnpm 9 cannot read `overrides` from pnpm-workspace.yaml, so a frozen
      # install fails on a fresh clone with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH
      # (verified locally); pnpm 10 is the lowest version that installs cleanly.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Frontend tests
        run: pnpm --filter @workspace/hime-ai run test

      - name: API server tests
        run: pnpm --filter @workspace/api-server run test --if-present
